# TAIGA runtime trait tuning / 词条运行时配置
# Copy to defaultconfigs/taiga-traits.toml before creating a world, or edit <world>/serverconfig/taiga-traits.toml.
# Server config is synchronized to clients. 20 ticks = 1 second; 1 health = half a heart.
# 工具耐久/槽位等重建属性修改后请重启世界；服务端配置自动同步客户端。

[tools.analysing]
# 护甲值转换为额外伤害的比例 / Range: 0 ~ 10
armorDamageRatio = 0.1
# 每级额外伤害上限 / Range: 0 ~ 1000
damageCapPerLevel = 5.0
# 每级采矿经验触发概率 / Range: 0 ~ 1
miningXpChancePerLevel = 0.1
# 触发时额外经验 / Range: 0 ~ 1000
miningXp = 1

[tools.arcane]
# 每级增加的升级槽 / Range: 0 ~ 10
slotsPerLevel = 1

[tools.berserk]
# 每级在生命完全损失时的伤害倍率增量 / Range: 0 ~ 10
damagePerMissingHealth = 0.4

[tools.blind]
# 每级致盲概率 / Range: 0 ~ 1
chancePerLevel = 0.15
# 致盲时间（刻） / Range: 0 ~ 72000
durationTicks = 60
# 效果等级，0为I / Range: 0 ~ 10
amplifier = 0

[tools.bright]
# 光明触发最低亮度 / Range: 0 ~ 15
